server:
  port: ${PORT:8099}

spring:
  application:
    name: chat-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/chatapp}
    username: ${DB_USER:chatapp}
    password: ${DB_PASSWORD:chatapp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true

app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
    ttl: ${JWT_TTL:3d}
  cookie:
    name: jwt
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    # Host mà trình duyệt truy cập được — dùng để ký presigned URL
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:chat-app}
    upload-url-ttl: 10m
    download-url-ttl: 1h
    max-avatar-size: 5MB
    max-attachment-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: health
